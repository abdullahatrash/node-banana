services:
  postgres:
    image: postgres:16-alpine
    container_name: node-banana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: node_banana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d node_banana"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

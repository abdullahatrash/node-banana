name: Production deployment

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  release-gate:
    name: required signed readiness gate
    uses: ./.github/workflows/release-promotion.yml
    with:
      build_id: ${{ github.sha }}
    secrets:
      deployment_gate_secret: ${{ secrets.RELEASE_DEPLOYMENT_GATE_SECRET }}
      readiness_signing_secret: ${{ secrets.RELEASE_READINESS_SIGNING_SECRET }}
      readiness_signing_key_id: ${{ secrets.RELEASE_READINESS_SIGNING_KEY_ID }}

  deploy:
    name: deploy manifest-bound commit
    runs-on: ubuntu-latest
    needs: release-gate
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull immutable production configuration
        run: pnpm dlx vercel@50.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build exact gated commit
        run: pnpm dlx vercel@50.5.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Promote exact gated artifact
        run: pnpm dlx vercel@50.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

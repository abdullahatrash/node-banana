name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        # Keep a cold, bounded check so dependency-type growth is visible in CI.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck --incremental false --extendedDiagnostics

      - name: Check authored localization and logical RTL layout
        run: pnpm i18n:check

      - name: Run Gate A deterministic tests
        run: pnpm test:gate-a

      - name: Check YouTube SDK integration
        run: pnpm test:run src/lib/social/providers/__tests__/youtube.test.ts src/lib/social/providers/__tests__/youtube.contract.test.ts

  build-prodlike:
    name: build-prodlike
    runs-on: ubuntu-latest
    needs: test
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/node_banana
      BETTER_AUTH_SECRET: ci-prodlike-auth-secret-7wqVb1L9pT2nX4mK8sR0dF6hJ3zQaC5
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (production-like auth env)
        run: pnpm build

name: Release promotion gate

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact immutable build or commit ID in the signed server manifest
        required: true
        type: string
  workflow_call:
    inputs:
      build_id:
        required: true
        type: string
    secrets:
      deployment_gate_secret:
        required: true
      readiness_signing_secret:
        required: true
      readiness_signing_key_id:
        required: true

permissions:
  contents: read

jobs:
  signed-readiness:
    name: signed release readiness
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify signed manifest-bound readiness
        env:
          RELEASE_GATE_ORIGIN: ${{ vars.PRODUCTION_RELEASE_GATE_ORIGIN }}
          RELEASE_GATE_ALLOWED_HOSTS: ${{ vars.PRODUCTION_RELEASE_GATE_ALLOWED_HOSTS }}
          RELEASE_GATE_WORKSPACE_ID: ${{ vars.RELEASE_GATE_WORKSPACE_ID }}
          RELEASE_EXPECTED_BUILD_ID: ${{ inputs.build_id }}
          RELEASE_DEPLOYMENT_GATE_SECRET: ${{ secrets.deployment_gate_secret }}
          RELEASE_READINESS_SIGNING_SECRET: ${{ secrets.readiness_signing_secret }}
          RELEASE_READINESS_SIGNING_KEY_ID: ${{ secrets.readiness_signing_key_id }}
        run: node scripts/verify-release-promotion.mjs

  promotion-authorized:
    name: promotion authorized
    runs-on: ubuntu-latest
    needs: signed-readiness
    steps:
      - run: echo "Signed release readiness passed; downstream deployment may promote this exact build."
